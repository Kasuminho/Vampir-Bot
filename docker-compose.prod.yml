version: '3.8'

services:
  vampir-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vampir-bot
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
