version: '3.8'

services:
  vampir-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vampir-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    volumes:
      # PERSISTÊNCIA CRÍTICA: Mantém todos os arquivos de dados (guilds, presenças, DKP, config) salvos na VPS
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
